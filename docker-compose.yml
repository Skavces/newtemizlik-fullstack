services:
  # Faz 7: backend/frontend/db/redis/nginx eklendi. Port numaraları (3003, 8081)
  # renel-enerji'nin aynı VPS'te kullandığı 3002/8080 ile çakışmayacak şekilde
  # seçildi (bkz. backend/.env.example, kök .env.example).
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_USER: newtemizlik
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: newtemizlik
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newtemizlik -d newtemizlik"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - redisdata:/data
    # --appendonly yes: yerel dev container'ın aksine burada AOF persistence
    # açık — JWT blacklist Redis restart'ında kaybolmasın diye (bkz. review notu)
    command: redis-server --appendonly yes --requirepass ${REDIS_PASS}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    mem_limit: 512m
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      PORT: "3001"
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: newtemizlik
      DB_PASS: ${DB_PASS}
      DB_NAME: newtemizlik
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 8h
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      REDIS_PASS: ${REDIS_PASS}
      REDIS_URL: redis://:${REDIS_PASS}@redis:6379
      UMAMI_URL: http://umami:3000
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      UMAMI_USER: ${UMAMI_USER:-admin}
      UMAMI_PASS: ${UMAMI_PASS}
      REVALIDATE_URL: ${REVALIDATE_URL:-http://next:3000/revalidate}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      LLM_CHAT_KEYS: ${LLM_CHAT_KEYS:-}
      LLM_DAILY_LIMIT: ${LLM_DAILY_LIMIT:-1000}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  next:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_UMAMI_URL: ${NEXT_PUBLIC_UMAMI_URL:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    restart: unless-stopped
    mem_limit: 512m
    expose:
      - "3000"
    environment:
      API_URL: http://backend:3001/api
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_UMAMI_URL: ${NEXT_PUBLIC_UMAMI_URL:-}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    volumes:
      # Next'in image-optimizer (sharp) ve ISR çıktı cache'i — volume olmadan
      # her deploy'da container'ın yazılabilir katmanıyla birlikte sıfırlanıyor,
      # bu da deploy sonrası ilk ziyaretçilerde soğuk-cache resize'ların nginx'in
      # proxy_read_timeout'unu aşıp 504 vermesine (görsellerin boş kalmasına) yol açıyordu.
      - next_cache:/app/.next/cache
    depends_on:
      - backend

  nginx:
    image: nginxinc/nginx-unprivileged:alpine
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      next:
        condition: service_started
      umami:
        condition: service_healthy

  umami-db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASS}
      POSTGRES_DB: umami
    volumes:
      - umami_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 10

  umami:
    # renel-enerji'de üretimde çalışan digest'e sabitlenmiş imaj — :latest kullanılmaz
    # (tedarik zinciri riski), bilinçli olmadan bump edilmez.
    image: ghcr.io/umami-software/umami:3.1.0@sha256:e3f80c0625aad7179b49da27d475357cabb1068b8cacd9a792cfd6966888b123
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASS}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
    healthcheck:
      # Umami host nginx'te ayrı bir subdomain (analytics.*) üzerinden sunulur,
      # kendi kök path'inde — BASE_PATH ile subpath (/umami) denendi ama bu
      # imaj'da asset/API path'leri prefix'siz üretiliyor (BASE_PATH etkisiz
      # çıktı), subdomain'e geçildi (bkz. review notu)
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      umami-db:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  uploads:
  umami_pgdata:
  next_cache:
