add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# GA4 (googletagmanager.com + inline init script) ve Umami (artık ayrı bir
# subdomain'de, analytics.newtemizlik.com — 'self' bunu kapsamaz, script-src/
# connect-src'e ayrıca eklendi) her sayfada yükleniyor — bu yüzden 'unsafe-inline'
# gerekiyor. Nonce tabanlı daha sıkı bir CSP ileride bir sertleştirme adımı
# olarak değerlendirilebilir, bugünkü kapsamda değil.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://analytics.newtemizlik.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://*.google-analytics.com https://*.analytics.google.com https://analytics.newtemizlik.com; frame-src https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
